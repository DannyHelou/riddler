<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riddler: the climb (reference prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<!--
  REFERENCE PROTOTYPE, not production code.
  - Open this file in a browser. Use the toggle (top right) to switch between desktop (1280x800) and phone (390x844).
  - Game logic, scoring and the burner reaction mirror lib/scoring.ts and lib/burner.ts exactly.
  - Differences from production: riddles and answers are in the client (production scores on the server),
    there is no countdown timer (speed bonus assumes half the time was used), and no persistence.
-->
<style>
  html, body { margin: 0; height: 100%; background: #03050d; font-family: 'VT323', monospace; color: #E8ECFF; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden; transform-origin: center center; }
  .abs { position: absolute; }
  .pix { position: absolute; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 4px dashed #FF5A4E; outline-offset: 6px; }
  .btn { border: 0; background: #FFE45C; color: #0B1026; font-family: 'Press Start 2P', monospace; font-size: 12px; min-height: 52px; padding: 0 22px; cursor: pointer;
         box-shadow: 0 -4px 0 0 #FFE45C, 0 4px 0 0 #FFE45C, -4px 0 0 0 #FFE45C, 4px 0 0 0 #FFE45C, 0 8px 0 0 #B8961A; margin: 4px 4px 10px; }
  .btn:active { transform: translateY(6px); box-shadow: 0 -4px 0 0 #FFE45C, 0 4px 0 0 #FFE45C, -4px 0 0 0 #FFE45C, 4px 0 0 0 #FFE45C; }
  .link { border: 0; background: none; color: #E8ECFF; font-size: 22px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; padding: 0; min-height: 44px; }
  #toggle { position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; }
  #toggle button { border: 0; padding: 8px 12px; background: #121A3A; color: #E8ECFF; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer; }
  #toggle button[aria-pressed="true"] { background: #FFE45C; color: #0B1026; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="toggle" role="group" aria-label="Preview size">
  <button id="t-desktop" aria-pressed="true">Desktop</button>
  <button id="t-phone" aria-pressed="false">Phone</button>
</div>
<div id="wrap"><div id="stage"></div></div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
/* ============ Reference math (mirrors lib/scoring.ts and lib/burner.ts) ============ */
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
function closeness(fmt, g, ans, cap) {
  if (!isFinite(g)) return 0;
  if (fmt === 'percent') return 1 - Math.min(Math.abs(g - ans), cap) / cap;
  if (g <= 0) return 0;
  return 1 - Math.min(Math.abs(Math.log10(g / ans)), cap) / cap;
}
const LEVELS = ['Goldfish', 'Guesser', 'Analyst', 'Quant', 'Genius', 'Oracle'];
const level = c => c >= 0.97 ? 'Oracle' : LEVELS[Math.min(4, Math.floor(c * 5))];
const points = (c, used, limit, hint) => Math.max(0, Math.round(100 * c) + Math.round(50 * c * Math.max(0, 1 - used / limit)) - (hint ? 25 : 0));
const ALT_PER_POINT = 250;
const PAN_MS = 650, BOOST_START = 750, BOOST_TOTAL = 2600;
const worldY = a => 12 * Math.sqrt(Math.max(0, a));
function flameIntensity(c, t) { if (t < 0) return 0; const peak = 0.15 + 0.85 * c, end = 300 + 1200 * c; return t < 150 ? (t / 150) * peak : t < end ? peak : Math.max(0, peak * (1 - (t - end) / 400)); }
function flamePixels(c, t) {
  const I = flameIntensity(c, t), h = Math.round(1 + 10 * I), flick = Math.floor(Math.max(0, t) / 70) % 2, core = c >= 0.97 ? '#9FE8FF' : '#FFFFFF', out = [];
  for (let r = 0; r < h; r++) {
    const f = h > 1 ? r / (h - 1) : 0, y = 13 - r;
    const cols = I < 0.05 ? [7, 8] : f < 0.4 ? [6, 7, 8, 9] : f < 0.75 ? [7, 8] : [flick ? 8 : 7];
    for (const x of cols) out.push({ x, y, color: I < 0.05 ? '#6FB7FF' : f < 0.3 ? (x === 7 || x === 8 ? core : '#FFE45C') : f < 0.6 ? '#FFE45C' : f < 0.85 ? '#F28C28' : '#FF5A4E' });
  }
  return out;
}
const hue = c => Math.round(130 * clamp01(c));
const flashOpacity = t => t <= 300 ? 0 : 0.38 * clamp01(1 - (t - 300) / 900);
const climbProgress = t => easeOut(clamp01((t - 300) / 1800));
const dipPx = (c, t) => c >= 0.2 ? 0 : Math.round(14 * Math.sin(Math.PI * clamp01((t - 250) / 700)));
function shakeOffset(c, t, reduce) {
  const e = Math.abs(2 * c - 1), A = 18 * e * e, D = 300 + 500 * e;
  if (reduce || t <= 300 || t >= 300 + D) return { x: 0, y: 0 };
  const amp = A * Math.pow(1 - (t - 300) / D, 2), snap = v => Math.round(v / 2) * 2 || 0;
  return { x: snap(amp * Math.sin(t / 11)), y: snap(amp * Math.cos(t / 17)) };
}

/* ============ Content (production: served by the API, answers withheld) ============ */
const RIDDLES = [
  { tier: 'Warm-up', color: '#4FD18B', fmt: 'quantity', ans: 5, trap: 100, cap: 2, unit: 'minutes', disp: '5 minutes', limit: 30,
    prompt: '5 machines make 5 widgets in 5 minutes. How many minutes would 100 machines take to make 100 widgets?' },
  { tier: 'The trap', color: '#FFE45C', fmt: 'percent', ans: 9.02, trap: 99, cap: 50, unit: '%', disp: 'about 9%', limit: 60,
    prompt: 'A disease affects 1 in 1,000 people. A test for it is 99% accurate. You test positive. What\u2019s the chance you actually have it?' },
  { tier: 'Boss', color: '#FF5A4E', fmt: 'quantity', ans: 6, trap: 4, cap: 0.5, unit: 'flips', disp: '6 flips', limit: 120,
    prompt: 'On average, how many flips of a fair coin does it take to get two heads in a row?' }
];

/* ============ Sprites ============ */
const PAL = { k:'#0B1026', l:'#C9D3FF', r:'#FF5A4E', y:'#FFE45C', g:'#4FD18B', w:'#FFFFFF', p:'#F29CB5', v:'#9B7BFF', o:'#F28C28', b:'#8A5A2B', B:'#5C3A1A', R:'#E0453A', D:'#A32A22', Y:'#FFD84D', Q:'#C9A227', c:'#DDE4FF' };
const SPR = {
  balloon: ['.....RRYYRR.....','...RRRYYYYRRR...','..RRRRYYYYRRRR..','.RwRRRYYYYRRRRD.','.RwRRRYYYYRRRRD.','RRRRRRYYYYRRRRDD','RRRRRRYYYYRRRRDD','RRRRRRYYYYRRRRDD','.RRRRRYYYYRRRRD.','.DRRRRYYYYRRRDD.','..DDRRYYYYRRDD..','...DDDQQQQDDD...','....l......l....','....l......l....','.....bbbbbb.....','.....BBBBBB.....'],
  tower: ['...l....','...l....','..lll...','..l.l...','.ll.ll..','.l...l..','ll...ll.','l.....l.'],
  mountain: ['....w...','...wlw..','..llll..','..llll..','.llllll.','.llllll.','llllllll','llllllll'],
  plane: ['........','...l....','...ll...','llllllll','...ll...','...l....','........','........'],
  flag: ['l.......','lrrr....','lrrr....','l.......','l.......','l.......','l.......','l.......'],
  star: ['...y....','...y....','.yyyyy..','..yyy...','..y.y...','........','........','........'],
  cloud: ['...cccc.....','.cccccccc...','cccccccccccc','.cccccccccc.']
};
/* Draw a pixel map as one element with box-shadows (one shadow per pixel). */
function shadowOf(rows, s) {
  const out = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) out.push(`${(x + 1) * s}px ${(y + 1) * s}px 0 0 ${PAL[ch]}`); }));
  return out.join(',');
}
function spriteEl(rows, s) {
  const box = document.createElement('div');
  box.style.cssText = `position:absolute;width:${rows[0].length * s}px;height:${rows.length * s}px`;
  const px = document.createElement('div');
  px.style.cssText = `position:absolute;left:${-s}px;top:${-s}px;width:${s}px;height:${s}px;box-shadow:${shadowOf(rows, s)}`;
  box.appendChild(px);
  return box;
}

const LANDMARKS = [[330, 'Eiffel Tower', '330 m', 'tower'], [828, 'Burj Khalifa', '828 m', 'tower'], [8849, 'Everest summit', '8,849 m', 'mountain'], [11000, 'Jets cruise', '11 km', 'plane'], [41400, 'Record skydive', '41 km', 'flag'], [100000, 'Edge of space', '100 km', 'star']];
const CLOUDS = [[1500, 0.12], [2600, 0.73], [4200, 0.19], [6000, 0.67], [12500, 0.33]];

/* ============ Layout configs (design brief §5.3 geometry table) ============ */
const CONFIGS = {
  desktop: { W: 1280, H: 800, signW: 820, signH: 320, gap: 120, pad: '24px 32px', promptPx: 34, inputW: 160, cardW: 600, hudFont: 14, phone: false },
  phone:   { W: 390,  H: 844, signW: 350, signH: 520, gap: 60,  pad: '22px 20px', promptPx: 28, inputW: 130, cardW: 358, hudFont: 11, phone: true }
};

/* ============ Game ============ */
const stage = document.getElementById('stage');
const live = document.getElementById('live');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cfg, geo, els, state, raf = null;

function fresh() { return { i: 0, phase: 'ask', alt: 0, fromAlt: 0, toAlt: 0, t: 0, c: 0, pts: 0, trapped: false, res: [], lastGuess: 0 }; }
const fmtAlt = a => a >= 10000 ? (Math.round(a / 100) / 10).toLocaleString('en-US') + ' km' : Math.round(a).toLocaleString('en-US') + ' m';
function mix(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; }

function build(mode) {
  cfg = CONFIGS[mode];
  const { W, H } = cfg;
  const BT0 = H / 2 - 48, signTop = BT0 - cfg.gap - cfg.signH;
  geo = { BX: W / 2 - 48, BT0, signTop, Q: H / 2 - (signTop + cfg.signH / 2) };
  stage.innerHTML = '';
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  fit();

  els = {};
  els.stars = document.createElement('div'); els.stars.className = 'abs'; els.stars.style.cssText = 'left:0;top:0;right:0;bottom:0';
  let v = 13; const rnd = () => (v = (v * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < (cfg.phone ? 30 : 50); i++) {
    const s = document.createElement('div'); const sz = rnd() > 0.8 ? 4 : 2;
    s.style.cssText = `position:absolute;left:${Math.floor(rnd() * W / 4) * 4}px;top:${Math.floor(rnd() * H * 0.6 / 4) * 4}px;width:${sz}px;height:${sz}px;background:${i % 7 ? '#C9D3FF' : '#FFE45C'}`;
    els.stars.appendChild(s);
  }
  stage.appendChild(els.stars);

  els.scene = document.createElement('div'); els.scene.className = 'abs'; els.scene.style.cssText = `left:0;top:0;width:${W}px;height:${H}px`;
  stage.appendChild(els.scene);

  els.clouds = CLOUDS.map(([a, xf]) => { const e = spriteEl(SPR.cloud, 8); e.style.opacity = 0.55; e.style.left = Math.round(xf * W) + 'px'; els.scene.appendChild(e); return { a, e }; });
  els.landmarks = LANDMARKS.map(([a, name, alt, icon]) => {
    const line = document.createElement('div'); line.style.cssText = `position:absolute;left:0;width:${W}px;height:0;border-top:2px dashed #3B4F8F`;
    const label = document.createElement('div');
    let iconEl = null;
    if (cfg.phone) { label.style.cssText = 'position:absolute;left:12px;font-size:18px;line-height:1;color:#9AA6D0;display:flex;flex-direction:column;gap:2px'; label.innerHTML = `<span>${name}</span><span>${alt}</span>`; }
    else { label.style.cssText = `position:absolute;left:${W - 216}px;font-size:22px;line-height:1;color:#9AA6D0;white-space:nowrap`; label.textContent = `${name}, ${alt}`; iconEl = spriteEl(SPR[icon], 4); iconEl.style.left = (W - 260) + 'px'; els.scene.appendChild(iconEl); }
    els.scene.appendChild(line); els.scene.appendChild(label);
    return { a, line, label, iconEl };
  });
  els.sea = document.createElement('div'); els.sea.style.cssText = `position:absolute;left:0;width:${W}px;height:1200px;background:#1B5873;border-top:6px solid #2E7FA0`;
  els.scene.appendChild(els.sea);
  els.fx = document.createElement('div'); els.fx.className = 'abs'; els.fx.style.cssText = 'left:0;top:0'; els.scene.appendChild(els.fx);

  els.balloon = spriteEl(SPR.balloon, 6); els.balloon.style.left = geo.BX + 'px'; els.balloon.setAttribute('role', 'img');
  els.flame = document.createElement('div'); els.flame.style.cssText = 'position:absolute;left:-6px;top:-6px;width:6px;height:6px';
  els.balloon.appendChild(els.flame); els.scene.appendChild(els.balloon);

  els.sign = document.createElement('div');
  els.sign.style.cssText = `position:absolute;left:${(W - cfg.signW) / 2}px;top:${signTop}px;width:${cfg.signW}px;height:${cfg.signH}px;box-sizing:border-box;background:rgba(8,12,30,.92);box-shadow:0 -4px 0 0 #C9D3FF,0 4px 0 0 #C9D3FF,-4px 0 0 0 #C9D3FF,4px 0 0 0 #C9D3FF;padding:${cfg.pad};display:flex;flex-direction:column;justify-content:center;gap:16px`;
  els.scene.appendChild(els.sign);

  els.flash = document.createElement('div'); els.flash.className = 'abs'; els.flash.style.cssText = `left:0;top:0;width:${W}px;height:${H}px;pointer-events:none;opacity:0`;
  stage.appendChild(els.flash);

  els.card = document.createElement('div');
  els.card.style.cssText = `position:absolute;left:${(W - cfg.cardW) / 2}px;top:64px;width:${cfg.cardW}px;box-sizing:border-box;background:rgba(8,12,30,.92);padding:20px 22px;display:none;flex-direction:column;gap:14px`;
  stage.appendChild(els.card);

  const hud = document.createElement('div');
  hud.innerHTML = `<div class="abs" style="left:${cfg.phone ? 16 : 32}px;top:${cfg.phone ? 22 : 36}px;font-family:'Press Start 2P',monospace;font-size:${cfg.hudFont}px">Riddler</div>
    <div id="dots" class="abs" role="img" aria-label="Riddle progress" style="${cfg.phone ? 'right:16px;top:22px' : 'left:32px;top:64px'};display:flex;gap:8px"></div>
    <div class="abs" style="left:${cfg.phone ? 16 : 32}px;bottom:${cfg.phone ? 16 : 32}px;background:rgba(8,12,30,.85);padding:10px 14px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:18px;color:#9AA6D0">Altitude</div><div id="alt" style="font-family:'Press Start 2P',monospace;font-size:13px">0 m</div></div>`;
  stage.appendChild(hud);
  els.dots = hud.querySelector('#dots'); els.alt = hud.querySelector('#alt');

  renderSign();
  frame();
}

function fit() {
  const s = Math.min(1, (innerWidth - 24) / cfg.W, (innerHeight - 24) / cfg.H);
  stage.style.transform = `scale(${s})`;
}

function renderSign() {
  const r = RIDDLES[Math.min(state.i, 2)];
  const fuel = Array.from({ length: 20 }, () => '<div style="height:10px;background:#E8ECFF"></div>').join('');
  els.sign.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div style="display:flex;align-items:center;gap:10px"><div style="width:16px;height:8px;background:${r.color}"></div>
      <div style="font-family:'Press Start 2P',monospace;font-size:11px">${r.tier}</div></div>
      <div style="font-size:22px;color:#9AA6D0">Riddle ${Math.min(state.i, 2) + 1} of 3</div></div>
    <div role="img" aria-label="Time left" style="display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px">${fuel}</div>
    <div style="font-size:${cfg.promptPx}px;line-height:1.12">${r.prompt}</div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
      <label for="guess" style="font-size:24px">Your answer</label>
      <input id="guess" type="text" inputmode="decimal" autocomplete="off" style="width:${cfg.inputW}px;height:48px;margin:4px;border:0;background:#121A3A;box-shadow:0 -4px 0 0 #C9D3FF,0 4px 0 0 #C9D3FF,-4px 0 0 0 #C9D3FF,4px 0 0 0 #C9D3FF;font-size:30px;color:#E8ECFF;padding:0 12px;box-sizing:border-box">
      <div style="font-size:24px;color:#9AA6D0">${r.unit}</div>
      <button id="fire" class="btn" style="${cfg.phone ? 'flex-basis:100%' : 'margin-left:auto'}">Fire the burner</button>
    </div>
    <div id="err" style="font-size:22px;color:#FF5A4E;min-height:22px"></div>`;
  const input = els.sign.querySelector('#guess');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') fire(); });
  input.addEventListener('input', () => { els.sign.querySelector('#err').textContent = ''; });
  els.sign.querySelector('#fire').addEventListener('click', fire);
  if (state.phase === 'ask') setTimeout(() => input.focus({ preventScroll: true }), 0);
}

function run(total, done) {
  if (raf) cancelAnimationFrame(raf);
  let start = null;
  const step = n => {
    if (start === null) start = n;
    state.t = n - start;
    if (state.t >= total) { done(); frame(); return; }
    frame(); raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function fire() {
  if (state.phase !== 'ask') return;
  const r = RIDDLES[state.i];
  const raw = els.sign.querySelector('#guess').value;
  const g = parseFloat(String(raw).replace(/[,%\s]/g, ''));
  if (!isFinite(g) || (r.fmt !== 'percent' && g <= 0)) { els.sign.querySelector('#err').textContent = r.fmt === 'percent' ? 'Enter a number from 0 to 100' : 'Enter a number above 0'; return; }
  const c = closeness(r.fmt, g, r.ans, r.cap), ct = closeness(r.fmt, g, r.trap, r.cap);
  const pts = points(c, r.limit / 2, r.limit, false);
  Object.assign(state, { phase: 'anim', c, pts, trapped: ct >= 0.8 && ct > c, fromAlt: state.alt, toAlt: state.alt + pts * ALT_PER_POINT, t: 0, lastGuess: g });
  state.res.push({ c });
  run(reduceMotion ? 1 : BOOST_START + BOOST_TOTAL, () => { state.phase = 'reveal'; state.alt = state.toAlt; state.t = 0; showCard(); });
}

function next() {
  if (state.i >= 2) { state.phase = 'done'; showCard(); frame(); return; }
  state.i++; state.phase = 'panup'; state.t = 0; els.card.style.display = 'none';
  renderSign();
  run(reduceMotion ? 1 : PAN_MS, () => { state.phase = 'ask'; state.t = 0; els.sign.querySelector('#guess').focus({ preventScroll: true }); });
}

function showCard() {
  const r = RIDDLES[state.i], col = `hsl(${hue(state.c)}, 85%, 64%)`;
  const frameCol = state.phase === 'reveal' ? col : '#FFE45C';
  els.card.style.boxShadow = `0 -4px 0 0 ${frameCol},0 4px 0 0 ${frameCol},-4px 0 0 0 ${frameCol},4px 0 0 0 ${frameCol}`;
  els.card.style.display = 'flex';
  if (state.phase === 'reveal') {
    const guessText = r.fmt === 'percent' ? `${Math.round(state.lastGuess * 10) / 10}%` : `${Math.round(state.lastGuess * 100) / 100} ${r.unit}`;
    els.card.innerHTML = `
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="font-family:'Press Start 2P',monospace;font-size:22px;color:${col}">${level(state.c)}</div>
        <div style="font-family:'Press Start 2P',monospace;font-size:12px">+${state.pts} points</div></div>
      <div style="font-size:24px;color:#9AA6D0">Climbed ${fmtAlt(state.pts * ALT_PER_POINT)}</div>
      ${state.trapped ? '<div style="align-self:flex-start;background:#FF5A4E;color:#0B1026;padding:4px 8px;font-size:22px">You fell for the trap</div>' : ''}
      <div style="font-size:26px;line-height:1.1">You said ${guessText}. The answer is <span style="color:#4FD18B">${r.disp}</span>.</div>
      <button id="next" class="btn" style="align-self:${cfg.phone ? 'stretch' : 'flex-end'}">${state.i >= 2 ? 'Finish the climb' : 'Next riddle'}</button>`;
    els.card.querySelector('#next').addEventListener('click', next);
    els.card.querySelector('#next').focus({ preventScroll: true });
    live.textContent = `${level(state.c)}. ${state.pts} points. You climbed ${fmtAlt(state.pts * ALT_PER_POINT)}. The answer is ${r.disp}.`;
  } else {
    els.card.innerHTML = `
      <div style="font-family:'Press Start 2P',monospace;font-size:20px;line-height:1.3;color:#FFE45C">Climb complete</div>
      <div style="font-size:26px;line-height:1.1">You reached ${fmtAlt(state.alt)}. Explanations and today's stats are waiting.</div>
      <button class="btn" style="align-self:${cfg.phone ? 'stretch' : 'flex-end'}" onclick="alert('Production: go to the Results and debrief page.')">See your results</button>
      <button id="replay" class="link" style="align-self:flex-start">Replay the prototype</button>`;
    els.card.querySelector('#replay').addEventListener('click', () => { state = fresh(); els.card.style.display = 'none'; renderSign(); frame(); });
  }
}

function frame() {
  const s = state, anim = s.phase === 'anim';
  let panK = s.phase === 'ask' ? 0 : 1;
  if (anim) panK = reduceMotion ? 1 : easeInOut(clamp01(s.t / PAN_MS));
  if (s.phase === 'panup') panK = reduceMotion ? 0 : 1 - easeInOut(clamp01(s.t / PAN_MS));
  const bt = anim ? s.t - BOOST_START : -1, burning = anim && bt >= 0;
  const cur = anim ? s.fromAlt + (s.toAlt - s.fromAlt) * climbProgress(bt) : s.alt;
  const uc = worldY(cur), BASE = geo.BT0 + 96;
  const shake = burning ? shakeOffset(s.c, bt, reduceMotion) : { x: 0, y: 0 };

  stage.style.background = mix('#24457A', '#060A18', clamp01(uc / 2600));
  els.stars.style.opacity = clamp01((uc - 700) / 1300);
  els.scene.style.transform = `translate(${shake.x}px, ${Math.round(geo.Q * (1 - panK)) + shake.y}px)`;

  for (const cl of els.clouds) cl.e.style.top = Math.round(BASE - (worldY(cl.a) - uc)) + 'px';
  for (const lm of els.landmarks) {
    const y = Math.round(BASE - (worldY(lm.a) - uc));
    lm.line.style.top = y + 'px';
    lm.label.style.top = (y - (cfg.phone ? 44 : 28)) + 'px';
    if (lm.iconEl) lm.iconEl.style.top = (y - 36) + 'px';
  }
  els.sea.style.top = Math.round(BASE + uc) + 'px';

  const dip = burning ? dipPx(s.c, bt) : 0;
  const bTop = geo.BT0 + dip;
  els.balloon.style.top = bTop + 'px';
  els.balloon.setAttribute('aria-label', `Your balloon at ${fmtAlt(cur)}`);
  els.flame.style.boxShadow = flamePixels(burning ? s.c : 0, burning ? bt : -1).map(p => `${(p.x + 1) * 6}px ${(p.y + 1) * 6}px 0 0 ${p.color}`).join(',');

  const cx = geo.BX + 48, cy = bTop + 40; let fx = '';
  if (burning && s.c < 0.2 && !reduceMotion) for (let j = 0; j < 5; j++) { const tt = clamp01((bt - 200 - j * 140) / 900); if (tt > 0 && tt < 1) fx += `<div class="pix" style="left:${Math.round((cx - 6 + (j % 2 ? -1 : 1) * tt * 36) / 2) * 2}px;top:${Math.round((bTop + 70 - tt * 150) / 2) * 2}px;width:12px;height:12px;background:#6B7599;opacity:${(1 - tt).toFixed(2)}"></div>`; }
  if (burning && s.c >= 0.8 && !reduceMotion) for (let q = 0; q < 12; q++) { const ts = clamp01((bt - 300) / 800); if (ts > 0 && ts < 1) { const a = q * Math.PI / 6, d = 30 + ts * 120; fx += `<div class="pix" style="left:${Math.round((cx + Math.cos(a) * d) / 2) * 2}px;top:${Math.round((cy + Math.sin(a) * d) / 2) * 2}px;width:6px;height:6px;background:${q % 2 ? '#FFE45C' : '#FFFFFF'};opacity:${(1 - ts).toFixed(2)}"></div>`; } }
  els.fx.innerHTML = fx;

  els.sign.style.opacity = (1 - panK).toFixed(2);
  els.sign.style.visibility = panK >= 1 ? 'hidden' : 'visible';
  els.flash.style.background = `hsl(${hue(s.c)}, 85%, 55%)`;
  els.flash.style.opacity = burning ? flashOpacity(bt).toFixed(2) : 0;

  els.dots.innerHTML = [0, 1, 2].map(k => { const rz = s.res[k]; const bg = rz && (k < s.i || s.phase === 'reveal' || s.phase === 'done' || (k === s.i && !anim)) ? `hsl(${hue(rz.c)}, 85%, 55%)` : k === s.i && s.phase !== 'done' ? '#E8ECFF' : '#3B4F8F'; return `<div style="width:14px;height:14px;background:${bg}"></div>`; }).join('');
  els.alt.textContent = fmtAlt(cur);
}

function setMode(mode) {
  document.getElementById('t-desktop').setAttribute('aria-pressed', mode === 'desktop');
  document.getElementById('t-phone').setAttribute('aria-pressed', mode === 'phone');
  if (raf) cancelAnimationFrame(raf);
  state = fresh();
  build(mode);
}
document.getElementById('t-desktop').addEventListener('click', () => setMode('desktop'));
document.getElementById('t-phone').addEventListener('click', () => setMode('phone'));
addEventListener('resize', () => cfg && fit());
setMode(innerWidth < 768 ? 'phone' : 'desktop');
</script>
</body>
</html>
